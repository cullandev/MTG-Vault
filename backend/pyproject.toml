[project]
name = "mtgvault"
version = "1.1.0"
description = "Self-hosted Magic: The Gathering collection and deck manager"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "ijson>=3.3",
    "argon2-cffi>=23.1",
    "rapidfuzz>=3.10",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "networkx>=3.3",
    "pillow>=11.0",
    "pytesseract>=0.3.13",
    # Card detection runs on the server (ADR-024). The headless wheel drops the GUI
    # bindings, which halves its size and removes the X11 shared libraries the slim
    # base image does not carry.
    "opencv-python-headless>=4.10",
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "coverage>=7.6",
    "hypothesis>=6.115",
    "ruff==0.16.4",
    "mypy>=1.13",
    "types-pyyaml",
    "types-networkx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
# pip install inside the image leaves a setuptools build/ tree behind; linting that
# copy double-reports every finding against a path nobody edits.
extend-exclude = ["build"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "C4",               # comprehensions
    "SIM",              # simplify
    "TID",              # tidy imports
    "RUF",
    "ASYNC",
    "D",                # docstrings on public API
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "D107",   # __init__ docstring not required (documented on the class)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
# Alembic autogenerates long single-line op.create_index calls; reformatting them by
# hand would make future autogenerated diffs unreadable.
"alembic/*" = ["D", "E501"]
# These two files exist *because* of ambiguous unicode characters, so flagging them
# as ambiguous is the tool misunderstanding the intent.
"app/util/text.py" = ["RUF001"]
"tests/unit/test_text.py" = ["RUF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
plugins = []
warn_unreachable = true
disallow_any_generics = true
# SQLAlchemy 2.0 typed ORM needs no plugin, but Alembic's generated code is untyped.
exclude = "^(alembic|tests)/"

[[tool.mypy.overrides]]
module = ["ijson.*", "apscheduler.*", "pytesseract.*", "paddleocr.*", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # starlette's TestClient prefers httpx2; app code targets httpx 0.x, which is what
    # the clients/ package is written against. The warning is about starlette's own
    # test helper, not about our HTTP usage.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    # anyio 4.15 deprecates the anyio.abc.BlockingPortal alias that starlette's
    # TestClient still imports. Same shape as above: their helper, not our code.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
addopts = "-q --strict-markers"
markers = [
    "slow: takes more than a few seconds; still runs in CI and before every phase gate",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
