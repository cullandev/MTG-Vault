# The same gates README.md lists under "The checks that gate a phase", run the
# way the README says to run them without Node or tesseract on the host: the
# backend inside its own test image (docker-compose.test.yml), the frontend on
# Node 22, and finally the runtime image itself, which is what a fresh clone
# actually ships.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        run: docker compose -f docker-compose.test.yml build tests
      - name: ruff check
        run: docker compose -f docker-compose.test.yml run --rm tests python -m ruff check .
      - name: ruff format --check
        run: docker compose -f docker-compose.test.yml run --rm tests python -m ruff format --check .
      - name: mypy
        run: docker compose -f docker-compose.test.yml run --rm tests python -m mypy
      - name: pytest
        run: |
          set -o pipefail
          docker compose -f docker-compose.test.yml run --rm tests python -m pytest -q -rf 2>&1 | tee pytest.log
      # Job logs are only visible to signed-in users; annotations show on the
      # run summary for everyone, so a red badge explains itself.
      - name: Annotate failures
        if: failure()
        run: |
          grep -E '^(FAILED|ERROR) ' pytest.log | sed 's/^/::error title=pytest::/' || true
          grep -E '^E  ' pytest.log | head -40 | sed 's/^/::warning title=pytest detail::/' || true

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  image:
    name: Runtime image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker build (app target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: app
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
